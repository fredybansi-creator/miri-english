<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Ralucas Welt – Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f6; font-family: -apple-system, system-ui, sans-serif; color: #2c3328;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); background: rgba(255,255,255,.85);
    border-radius: 12px; padding: 7px 11px; font-size: 13px; line-height: 1.35; pointer-events: none; }
  .needs { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .bar { display: flex; align-items: center; gap: 3px; }
  .bar i { display: block; width: 34px; height: 8px; border-radius: 4px; background: #dfe6dc; overflow: hidden; }
  .bar i b { display: block; height: 100%; width: 100%; background: #5bb04a; transition: width .4s; }
  .fps { font-size: 11px; color: #6a7564; margin-top: 4px; } .fps b { font-size: 12px; color: #2c3328; }
  #act { position: fixed; right: calc(112px + env(safe-area-inset-right)); bottom: calc(40px + env(safe-area-inset-bottom)); min-width: 96px; height: 64px;
    padding: 0 12px; border-radius: 32px; border: 2px solid rgba(255,255,255,.8); background: rgba(74,154,62,.92); color: #fff; font: inherit; font-weight: 600;
    font-size: 14px; touch-action: none; }
  #dig { position: fixed; right: calc(112px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); min-width: 96px; height: 52px;
    padding: 0 12px; border-radius: 26px; border: 2px solid rgba(255,255,255,.8); background: rgba(138,98,60,.92); color: #fff; font: inherit; font-weight: 600;
    font-size: 14px; touch-action: none; -webkit-user-select: none; user-select: none; }
  #build { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(122px + env(safe-area-inset-bottom)); width: 78px; height: 52px;
    border-radius: 26px; border: 2px solid rgba(255,255,255,.8); background: rgba(160,120,80,.92); color: #fff; font: inherit; font-weight: 600; font-size: 14px;
    touch-action: none; -webkit-user-select: none; user-select: none; display: none; padding: 0; }
  #homeBtn { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(114px + env(safe-area-inset-top)); width: 46px; height: 46px;
    border-radius: 14px; border: 0; background: rgba(255,246,232,.95); font-size: 24px; line-height: 1; display: none; }
  .decor { display: flex; flex-direction: column; gap: 6px; max-height: 56vh; overflow-y: auto; margin: 8px 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 14px; border: 1px solid #e3e9df; background: #fafcf8; }
  .item .ic { font-size: 28px; } .item .nm { flex: 1; display: flex; flex-direction: column; } .item .nm b { font-size: 15px; }
  .item .nm small { font-size: 12px; color: #6a7564; } .item .btn { flex: 0 0 auto; padding: 9px 12px; font-size: 14px; } .item.done { background: #eaf7ea; }
  .spell { justify-content: center; } .spell .slot { width: 30px; height: 40px; border-bottom: 3px solid #c9d6c3; margin: 0 2px; } .spell .gap { width: 14px; }
  .tile.ltr { min-width: 38px; padding: 8px 0; text-align: center; font-weight: 700; }
  #earth { position: fixed; left: calc(10px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.85);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; display: none; pointer-events: none; }
  #fade { position: fixed; inset: 0; background: #0b1020; opacity: 0; pointer-events: none; transition: opacity .9s; }
  #hint { position: fixed; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top)); text-align: center; font-size: 14px; pointer-events: none;
    transition: opacity .6s; }
  #hint span { background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 12px; }
  #stick { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; background: rgba(255,255,255,.28);
    border: 2px solid rgba(255,255,255,.7); pointer-events: none; display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.9); }
  #jump { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom)); width: 78px; height: 78px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: rgba(244,138,55,.9); color: #fff; font: inherit; font-weight: 600; font-size: 14px;
    touch-action: none; }
  #goal { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); background: rgba(255,255,255,.85);
    border-radius: 12px; padding: 7px 11px; font-size: 13px; line-height: 1.35; pointer-events: none; display: flex; align-items: center; gap: 8px; }
  #goal b { font-size: 15px; } #goal .q { color: #e0a400; font-weight: 800; font-size: 18px; }
  #arrow { display: inline-block; font-size: 18px; line-height: 1; color: #b8521a; }
  #sheet { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(20,30,20,.25); }
  #sheet.open { display: flex; }
  #card { width: 100%; max-width: 480px; box-sizing: border-box; background: #fff; border-radius: 22px 22px 0 0;
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
  #card p { margin: 0 0 8px; } #card .small { font-size: 13px; color: #6a7564; } #card .de { font-size: 19px; font-weight: 600; }
  #card .en { font-size: 17px; font-weight: 600; } #card .ok { color: #2e8b3d; font-weight: 700; } #card .no { color: #b8521a; font-weight: 700; }
  .answer { min-height: 52px; border: 2px dashed #c9d6c3; border-radius: 14px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .answer.right { border: 2px solid #2e8b3d; background: #eaf7ea; } .answer.wrong { border: 2px solid #d9622b; background: #fdeee6; }
  .answer .ph { font-size: 13px; color: #8a9484; padding: 0 6px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 44px; }
  .tile { font: inherit; font-size: 17px; padding: 9px 13px; border-radius: 12px; border: 1px solid #c9d6c3; background: #f6faf4; color: #2c3328; }
  .tile.used { opacity: .25; }
  .row { display: flex; gap: 8px; margin-top: 6px; }
  .btn { flex: 1; font: inherit; font-size: 16px; font-weight: 600; padding: 13px; border-radius: 14px; border: 1px solid #c9d6c3; background: #fff; color: #2c3328; }
  .btn.primary { background: #b8521a; border-color: #b8521a; color: #fff; } .btn:disabled { opacity: .45; }
  #bookBtn { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(60px + env(safe-area-inset-top)); width: 46px; height: 46px;
    border-radius: 14px; border: 0; background: rgba(255,255,255,.88); font-size: 24px; line-height: 1; }
  #found { position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 18px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    transition: opacity .3s, transform .3s; white-space: nowrap; }
  #found.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #found .ic { font-size: 30px; } #found b { display: block; font-size: 20px; } #found small { display: block; font-size: 13px; color: #6a7564; } #found .say { font-size: 22px; }
  .book { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; margin: 8px 0; }
  .entry { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px; border-radius: 14px; border: 1px solid #c9d6c3; background: #f6faf4; color: #2c3328; position: relative; }
  .entry .ic { font-size: 26px; } .entry b { font-size: 15px; } .entry small { font-size: 11px; color: #6a7564; } .entry i { position: absolute; right: 6px; top: 4px; font-style: normal; font-size: 11px; color: #8a9484; }
  .entry.unknown { opacity: .45; } .entry.unknown .ic { font-weight: 800; color: #8a9484; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; background: rgba(255,255,255,.88); border-radius: 999px; padding: 3px 9px; font-size: 13px; font-weight: 700;
    color: #2c3328; white-space: nowrap; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .talk { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; } .talk .who { font-size: 40px; line-height: 1; }
  .talk b { font-size: 16px; } .hearts { font-size: 12px; } .talk .en { margin: 4px 0 2px; font-size: 18px; } .spk { font-size: 15px; }
  #card .task { background: #fff6e8; border-radius: 12px; padding: 9px 11px; font-size: 15px; }
  .typed { display: flex; gap: 8px; margin-top: 8px; } .typed input { flex: 1; font: inherit; font-size: 17px; padding: 11px; border-radius: 12px; border: 1px solid #c9d6c3; }
  .typed .btn { flex: 0 0 auto; } .typed[hidden] { display: none; }
  .pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .pals div { display: flex; flex-direction: column; align-items: center; background: #fff6e8; border-radius: 12px; padding: 6px 2px; }
  .pals span { font-size: 24px; } .pals b { font-size: 13px; } .pals small { font-size: 8px; letter-spacing: -1px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 17px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><div class="needs"><span id="clock">☀️</span><span class="bar">🍖<i><b id="bFood"></b></i></span><span class="bar">💧<i><b id="bWater"></b></i></span><span class="bar">⚡<i><b id="bEnergy"></b></i></span></div><div class="fps"><b id="fps">–</b> Bilder/s · <span id="note">wird gemessen …</span></div></div>
<button id="bookBtn" aria-label="Buch">📖</button>
<div id="goal"><span class="q">?</span><b id="count">0 / 0</b><span id="arrow">↑</span><span id="dist"></span></div>
<div id="hint"><span id="hintText"></span></div>
<div id="stick"><div id="knob"></div></div>
<button id="act">👃 Schnüffeln</button>
<button id="jump">Springen</button>
<button id="dig">🐾 Graben</button>
<div id="earth"></div>
<button id="build">🧱 Bauen</button>
<button id="homeBtn" aria-label="Bau einrichten">🏠</button>
<div id="labels"></div>
<div id="fade"></div>
<div id="found"></div>
<div id="sheet"><div id="card"></div></div>
<div id="err">Dieses Gerät kann kein 3D (WebGL).</div>
<script type="module" src="./welt.js"></script>
</body>
</html>
